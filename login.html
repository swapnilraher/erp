<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Techstar ERP Login...</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <script>
    (function() {
      const hostname = window.location.hostname;
      let erpBase = "https://erp.techstarerp.com";
      if (hostname === "localhost" || hostname === "127.0.0.1") {
        erpBase = "http://localhost:3000";
      } else if (hostname.endsWith("web.app") || hostname.endsWith("firebaseapp.com")) {
        erpBase = "https://erp-by-swapnilaher.web.app";
      } else if (hostname.includes(".")) {
        const rootDomain = hostname.replace(/^www\./, "");
        erpBase = "https://erp." + rootDomain;
      }
      const targetUrl = erpBase + "/login" + window.location.search;
      window.location.replace(targetUrl);
    })();
  </script>
</head>
<body style="background:var(--color-bg-alt); display:flex; align-items:center; justify-content:center; min-height:100vh; padding: 20px; font-family:'Inter', sans-serif;">

  <div class="demo-form-card" style="max-width: 440px; width: 100%; text-align:center; padding:36px 28px;">
    <a href="index.html" class="logo" style="justify-content:center; margin-bottom:20px; display:inline-flex;">
      <img src="assets/logo.svg" alt="Techstar ERP Logo" style="height: 42px;">
    </a>

    <div style="margin:24px auto; width:48px; height:48px; border:4px solid #e0e7ff; border-top-color:#4f46e5; border-radius:50%; animation:spin 0.8s linear infinite;"></div>

    <h1 class="text-xl font-extrabold" style="color:var(--color-primary-dark); margin-bottom:8px;">
      Connecting to Secure Cloud Workspace...
    </h1>
    <p class="text-sm text-muted" style="margin-bottom:24px;">
      Redirecting you to the Techstar ERP authentication portal.
    </p>

    <a id="fallbackBtn" href="https://erp.techstarerp.com/login" class="btn btn-primary" style="display:inline-block; width:100%;">
      Continue to ERP Login &rarr;
    </a>

    <div style="margin-top:20px; font-size:12px; color:#64748b;">
      Don't have an account? <a href="https://erp.techstarerp.com/register" id="regLink" style="color:var(--color-primary); font-weight:600;">Start Free Trial</a>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    (function() {
      const hostname = window.location.hostname;
      let erpBase = "https://erp.techstarerp.com";
      if (hostname === "localhost" || hostname === "127.0.0.1") {
        erpBase = "http://localhost:3000";
      } else if (hostname.endsWith("web.app") || hostname.endsWith("firebaseapp.com")) {
        erpBase = "https://erp-by-swapnilaher.web.app";
      } else if (hostname.includes(".")) {
        const rootDomain = hostname.replace(/^www\./, "");
        erpBase = "https://erp." + rootDomain;
      }
      document.getElementById("fallbackBtn").href = erpBase + "/login" + window.location.search;
      document.getElementById("regLink").href = erpBase + "/register" + window.location.search;
    })();
  </script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="techstar-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="techstar-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#F37021" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(10, 10)" filter="url(#glow)">
    <!-- Base Shield Icon -->
    <rect x="5" y="5" width="70" height="70" rx="18" fill="url(#techstar-blue)" />
    <!-- Stylized T Bar -->
    <path d="M 22 25 L 58 25 A 3 3 0 0 1 61 28 L 61 33 A 3 3 0 0 1 58 36 L 46 36 L 46 58 A 3 3 0 0 1 43 61 L 37 61 A 3 3 0 0 1 34 58 L 34 36 L 22 36 A 3 3 0 0 1 19 33 L 19 28 A 3 3 0 0 1 22 25 Z" fill="#FFFFFF"/>
    <!-- Glowing Star Emblem -->
    <path d="M 54 18 L 57 26 L 65 29 L 57 32 L 54 40 L 51 32 L 43 29 L 51 26 Z" fill="url(#techstar-orange)" />
  </g>

  <!-- Logo Text -->
  <text x="100" y="52" font-family="'Inter', sans-serif" font-weight="800" font-size="34" fill="#0F172A" letter-spacing="-0.5">Techstar<tspan fill="#2563EB">ERP</tspan></text>
  <text x="102" y="72" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#64748B" letter-spacing="2">SMART CLOUD ACCOUNTING</text>
</svg>
